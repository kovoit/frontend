# Intégration continue du back-office : lint, tests (Vitest + MSW) et build de production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build
